[project]
name = "market-data-platform"
version = "0.1.0"
description = "Real-time market data platform with anomaly detection and agentic incident enrichment"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"]

[tool.black]
line-length = 100
target-version = ["py39"]